<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AQI Predictor – Login</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- External CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body class="light-bg">

<div class="container">

  <!-- CARD -->
  <div class="card">

    <!-- Title -->
    <h2 class="title">AQI Predictor</h2>
    <p class="subtitle">Real-time Air Quality Intelligence</p>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Message -->
    <div id="msg" class="message"></div>

    <!-- LOGIN FORM -->
    <form id="login-form" onsubmit="handleLogin(event)">

      <input id="login-email" class="form-input" type="email" placeholder="Email" required />

      <div class="password-field">
        <input id="login-password" class="form-input" type="password" placeholder="Password" required />
        <button type="button" onclick="togglePw('login-password')">👁</button>
      </div>

      <button type="submit" class="btn-submit">Login</button>
    </form>

    <!-- SIGNUP FORM -->
    <form id="signup-form" style="display:none" onsubmit="handleSignup(event)">

      <input id="signup-name" class="form-input" type="text" placeholder="Full Name" required />

      <input id="signup-email" class="form-input" type="email" placeholder="Email" required />

      <input id="signup-password" class="form-input" type="password" placeholder="Password" required />

      <button type="submit" class="btn-submit">Create Account</button>
    </form>

  </div>

</div>

<!-- External JS -->
<script src="script.js"></script>

</body>
</html>
